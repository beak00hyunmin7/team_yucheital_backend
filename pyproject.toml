[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-drainage-fastapi"
version = "0.1.0"
description = "FastAPI backend for DEM-based drain location recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116,<1.0",
    "numpy>=2.0,<3.0",
    "pillow>=11.0,<13.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.3,<3.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
